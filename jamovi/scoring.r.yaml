name: scoring
title: Scoring
jrs: '1.0'
items:

## these are handled by SmartInfo class
    -   name: info
        title: Introduction
        type: Html
    -   name: extrainfo
        title: Extra Info
        type: Html
        visible: false
    -   name: issues
        title: Issues
        type: Html
        visible: false

    -   name: formula
        title: Formula
        type: Html

    -   name: varstab
        title: Variables
        type: Table
        columns:
            -   name: name
                type: text
                title: Name
            -   name: type
                type: text
                title: Type
            -   name: transf
                type: text
                title: Transform
            -   name: method
                type: text
                title: Inclusion
            -   name: selected
                type: text
                title: Selected
            -   name: selected_trans
                type: text
                title: Selected Transf.
    -   name: final
        title: Final model
        type: Table
        columns:
            -   name: name
                type: text
                title: Predictors
            -   name: fun
                type: text
                title: Transf.
            -   name: estimate
                type: number
                title: Coef
            -   name: se
                type: number
                title: SE
            -   name: test
                type: number
                title: z
            -   name: df
                type: integer
                title: df_res
            -   name: p
                title: p
                type: number
                format: zto,pvalue

    -   name: univariate
        title: Univariate effects
        type: Table
        columns:
            -   name: name
                type: text
                title: Predictor
            -   name: fun
                type: text
                title: Transf.

            -   name: estimate
                type: number
                title: Coef
            -   name: r2
                type: number
                title: R²
            -   name: aic
                type: number
                title: AIC
            -   name:  test
                type: number
                title: z
            -   name: df
                type: integer
                title: df
            -   name: p
                title: p
                type: number
                format: zto,pvalue

    -   name: multiple
        title: Multiple model
        type: Table
        columns:
            -   name: name
                type: text
                title: Predictors
            -   name: fun
                type: text
                title: Transf.
            -   name: estimate
                type: number
                title: Coef
            -   name: se
                type: number
                title: SE
            -   name: test
                type: number
                title: z
            -   name: df
                type: integer
                title: df
            -   name: p
                title: p
                type: number
                format: zto,pvalue
