name: scoring
title: Scoring
jrs: '1.0'
items:

## these are handled by SmartInfo class
    -   name: info
        title: Introduction
        type: Html
    -   name: extrainfo
        title: Extra Info
        type: Html
        visible: false
    -   name: issues
        title: Issues
        type: Html
        visible: false

    -   name: varstab
        title: Variables
        type: Table
        columns:
            -   name: name
                type: text
                title: Name
            -   name: type
                type: text
                title: Type
            -   name: forced
                type: text
                title: Transform
            -   name: method
                type: text
                title: Inclusion
            -   name: selected
                type: text
                title: Selected
            -   name: selected_trans
                type: text
                title: Selected Transf.

    -   name: univariate
        title: Univariate effects
        type: Table
        columns:
            -   name: term
                type: text
                title: Predictors
            -   name: b
                type: number
                title: Coef
            -   name: r2
                type: number
                title: R²
            -   name:  test
                type: number
                title: F
            -   name: df1
                type: integer
                title: df1
            -   name: df2
                type: integer
                title: df2
            -   name: p
                title: p
                type: number
                format: zto,pvalue
        clearWith:
            - dep
            - factors
            - covs
    -   name: multiple
        title: Multiple model
        type: Table
        columns:
            -   name: term
                type: text
                title: Predictors
            -   name: b
                type: number
                title: Coef
            -   name: se
                type: number
                title: SE
            -   name: test
                type: number
                title: t
            -   name: df
                type: integer
                title: df
            -   name: p
                title: p
                type: number
                format: zto,pvalue
        clearWith:
            - dep
            - factors
            - covs
    -   name: final
        title: Final model
        type: Table
        columns:
            -   name: term
                type: text
                title: Predictors
            -   name: b
                type: number
                title: Coef
            -   name: se
                type: number
                title: SE
            -   name: test
                type: number
                title: t
            -   name: df
                type: integer
                title: df
            -   name: p
                title: p
                type: number
                format: zto,pvalue
        clearWith:
            - dep
            - factors
            - covs
